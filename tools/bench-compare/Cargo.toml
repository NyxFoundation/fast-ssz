[package]
name = "nyx-ssz-bench-compare"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
nyx-ssz = { path = "../../crates/nyx-ssz" }
libssz = "=0.3.0"
libssz-types = "=0.3.0"
libssz-derive = "=0.3.0"
libssz-merkle = "=0.3.0"
sha2 = "=0.10.9"
hex = "=0.4.3"
serde_json = "1"

[dev-dependencies]
criterion = { version = "=0.7.0", default-features = false }

[[bench]]
name = "compare"
harness = false

[profile.bench]
opt-level = 3
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
