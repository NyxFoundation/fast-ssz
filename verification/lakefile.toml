name = "NyxSszVerification"
version = "0.1.0"
defaultTargets = ["NyxSszVerification"]

[leanOptions]
warningAsError = true
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "NyxSszVerification"
roots = ["NyxSszVerification", "NyxSszVerification.Audit"]

[[lean_lib]]
name = "NyxSszRust"

[[require]]
name = "aeneas"
git = "https://github.com/NyxFoundation/aeneas"
rev = "a11469524b7169278dbac472fe593abde5b0ac3e"
subDir = "backends/lean"

[[require]]
name = "ssz"
git = "https://github.com/ethereum/ssz-specs"
rev = "c68b96a852559284cc4311b6c14105bcf51ac6ce"
subDir = "lean"
