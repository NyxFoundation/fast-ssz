name = "NyxSszVerification"
version = "0.1.0"
defaultTargets = ["NyxSszVerification.CurrentAudit"]

[leanOptions]
warningAsError = true
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "NyxSszVerification"
roots = ["NyxSszVerification", "NyxSszVerification.Audit"]

[[lean_lib]]
name = "NyxSszRust"

[[require]]
name = "aeneas"
git = "https://github.com/NyxFoundation/aeneas"
rev = "3a7383419516c80c634f8d9b392e8cb7a0b3580f"
subDir = "backends/lean"

[[require]]
name = "ssz"
git = "https://github.com/ethereum/ssz-specs"
rev = "c68b96a852559284cc4311b6c14105bcf51ac6ce"
subDir = "lean"
