name: Benchmark harness conformance
on:
  pull_request:
    paths:
      - "tools/bench-compare/**"
      - ".github/workflows/bench-compare.yml"
  push:
    paths:
      - "tools/bench-compare/**"
      - ".github/workflows/bench-compare.yml"
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24.1"
          cache-dependency-path: tools/bench-compare/go/go.sum
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-18 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --manifest-path tools/bench-compare/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tools/bench-compare/Cargo.toml --all-targets -- -D warnings
      - run: python3 -m unittest discover -s tools/bench-compare -p 'test_*.py'
      - name: Verify exact cross-library bytes, fields and roots without timing
        run: python3 tools/bench-compare/run.py check --out "$RUNNER_TEMP/bench-preflight"
      - name: Check pinned generated Go methods
        working-directory: tools/bench-compare/go
        run: |
          go generate ./...
          git diff --exit-code -- encoding.go
          go vet ./...
