name: Verify implemented codec slice

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-18 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Test 32-bit native size boundaries
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          rustup target add --toolchain nightly-2026-08-18 i686-unknown-linux-musl
          cargo test --locked --workspace --all-features --target i686-unknown-linux-musl
      - name: Install pinned reference decompressor
        run: |
          python3 -m venv "$RUNNER_TEMP/nyx-vector-env"
          "$RUNNER_TEMP/nyx-vector-env/bin/pip" install -r tools/official-vectors/requirements.txt
      - name: Check all nine official vector families
        run: '"$RUNNER_TEMP/nyx-vector-env/bin/python" scripts/official_vectors.py check'
      - run: rustup component add llvm-tools --toolchain nightly-2026-08-18
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - run: cargo llvm-cov --workspace --fail-under-lines 80
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  refinement:
    name: Current Aeneas slice and explicit unproved status
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-18 --profile minimal --component rustfmt --component clippy
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: verification
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - run: cargo install cargo-hax --version 0.4.0 --locked
      - run: python3 scripts/verify.py bootstrap
      - run: python3 scripts/current_refinement.py check
